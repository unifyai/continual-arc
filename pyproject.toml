[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continual-arc"
dynamic = ["version"]
description = "Continual-ARC: a continual learning benchmark built on ARC-AGI's three editions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "unify" }]
keywords = ["arc", "arc-agi", "continual-learning", "benchmark", "lifelong-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
# ARC-AGI-3, the third track: ARC Prize's game engine plays the pinned games, and its toolkit downloads them
arc3 = ["arcengine==0.9.3; python_version >= '3.12'", "arc-agi==0.9.9; python_version >= '3.12'"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "matplotlib>=3.7", "continual-arc[arc3]"]

[project.scripts]
continual-arc = "continual_arc.cli:main"

[project.urls]
Repository = "https://github.com/unifyai/continual-arc"
Homepage = "https://unify.ai/continual-arc"

[tool.hatch.build.targets.wheel]
packages = ["src/continual_arc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["data: tests that need the fetched Re-ARC / ARC-AGI data", "arc3: tests that need arcengine and the pinned ARC-AGI-3 games"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.hatch.version]
path = "src/continual_arc/_version.py"

# The learners the paper evaluates (baselines/) and the training of its trained rows (training/) are packages of their
# own, run against the benchmark beside them.
[tool.uv.workspace]
members = ["baselines", "training"]
