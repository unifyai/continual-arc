name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check src tests
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: ~/.cache/continual-arc
          key: continual-arc-data-${{ hashFiles('src/continual_arc/data.py') }}
      - name: Fetch pinned data
        run: uv run continual-arc data fetch
      - name: Test
        run: uv run pytest
