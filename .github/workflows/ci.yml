name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # The workspace's lock covers the baselines' Pythons alone, so the benchmark's own environment is built by hand
      # and every command runs in it as it is (--no-sync).
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check src tests
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: ~/.cache/continual-arc
          key: continual-arc-data-${{ hashFiles('src/continual_arc/data.py') }}
      - name: Fetch pinned data
        run: uv run --no-sync continual-arc data fetch
      - name: Test
        run: uv run --no-sync pytest

  baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Lint
        working-directory: baselines
        run: uv run --no-sync ruff check src tests
      - name: Test
        working-directory: baselines
        run: uv run --no-sync pytest

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Lint
        working-directory: training
        run: uv run --no-sync ruff check src tests
      - name: Cache pinned data
        uses: actions/cache@v4
        with:
          path: ~/.cache/continual-arc
          key: continual-arc-data-${{ hashFiles('src/continual_arc/data.py') }}
      - name: Fetch pinned data
        run: uv run --no-sync continual-arc data fetch
      # Without torch or a GPU: the trainer's tests skip, and the node scripts run against stubbed tools.
      - name: Test
        working-directory: training
        run: uv run --no-sync pytest
