name: Verify my learner
description: Have unify rerun your learner on Continual-ARC's held-out rules or games, on a key we make for the run and you pay for ahead, for a verified result on the leaderboard.
title: "Verify: "
labels: ["verify"]
body:
  - type: markdown
    attributes:
      value: |
        We rerun your learner on the held-out season of the track you name, at a seed of its own: on ARC-AGI-1 and ARC-AGI-2, 25 new rules nobody outside unify has seen, streamed over 200 instances, and on ARC-AGI-3 new games nobody outside unify has seen, 8 fresh levels of each streamed; then two frozen tests played from where the stream left your learner: fresh instances of the streamed rules or games (the seen test) and more held out (the held-out test). A track whose held-out season is not ready reruns your learner on its public tasks at a seed of its own instead, and the result shows as reproduced, not verified, since their answers are public. The share of its reset's spend it saves on each places it on the leaderboard's plane, memorization across and generalization up, read against your learner reset on the same instances, with the budget used and share solved by both beside it and each model you name shown bare too; its share learned is read against your learner reset on the same stream. Your code runs in a sandbox on a machine of its own, which has no public network and holds neither our rules nor the run's key, and reaches nothing but our tracking proxy, which makes its model calls on a key we make for the run: chat completions to the models you name here, each at the effort you name, and nothing else. Before each test instance we restart that machine and put your learner's files back as the stream left them, so what it carries from the stream to the tests is what it keeps as files. Your package installs from PyPI and GitHub alone. The result is posted on this issue and joins the leaderboard, as verified or as reproduced. How it works: the README's "Verified results".

        You pay ahead for your run's model calls, which we make on a key of our own capped at the budget you set here: it pays for your learner, its reset and each model you name played bare. We pay for the machines. Once the issue is checked we post a link to pay by card on Stripe's page: the budget, OpenRouter's 5.5 percent fee on buying that credit, and Stripe's fee on the payment. What the run does not spend goes back to your card, less Stripe's fee. A GPT-6 Luna learner, its reset and its model bare have cost tens of dollars on ARC-AGI-1; ARC-AGI-3's games are long conversations and cost far more.
  - type: input
    id: name
    attributes:
      label: System name
      description: As the leaderboard should show it, with its version.
      placeholder: my-harness 1.4, memory on
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      description: The ARC-AGI edition your learner plays. It is rerun on that track's held-out season and compared only with results on the same track.
      options: [ARC-AGI-1, ARC-AGI-2, ARC-AGI-3]
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Contact
      description: A GitHub handle or an email address. This issue is public.
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Code repository
      description: The public GitHub repository your learner installs from with pip.
      placeholder: https://github.com/you/my-harness
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The full 40-character commit to run.
    validations:
      required: true
  - type: input
    id: learner
    attributes:
      label: Learner
      description: The import path of the class that implements the benchmark's learner protocol (continual_arc.learner), such as your harness's SystemLearner adapter. It is built with no arguments.
      placeholder: my_harness.learners:MyLearner
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model it plays with
      description: The OpenRouter model id, as OpenRouter lists it, with no variant such as :online. It plays your tests bare too, beside them. A router or a model that searches the web as part of a call is not taken.
      placeholder: openai/gpt-6-luna
    validations:
      required: true
  - type: input
    id: teacher
    attributes:
      label: Teacher model
      description: The OpenRouter model id of the model that teaches the one it plays with, such as one that writes its notes, if it has one. The leaderboard shows it beside the model it plays with.
      placeholder: z-ai/glm-5.3-flash
  - type: dropdown
    id: teacher_effort
    attributes:
      label: Teacher's reasoning effort
      description: The teacher's effort, if it has one. Every call to it goes at this effort, and it plays your tests bare at it too.
      options: [minimal, low, medium, high, xhigh, max]
      default: 2
  - type: dropdown
    id: effort
    attributes:
      label: Reasoning effort
      description: The effort your learner plays at, which the floor plays at too. Every call to the model goes at this effort.
      options: [minimal, low, medium, high, xhigh, max]
      default: 2
    validations:
      required: true
  - type: textarea
    id: other_models
    attributes:
      label: Other models it calls
      description: Every other OpenRouter model your learner calls, one per line, each with its reasoning effort, such as `z-ai/glm-5.3 low`. Our proxy refuses a call to any model this form does not name, every call goes at the effort named, and each model named plays your tests bare.
  - type: input
    id: public_run
    attributes:
      label: Public-stream run
      description: The pull request with your run on the public stream, if you have one, so the two can stand side by side.
  - type: input
    id: budget
    attributes:
      label: Budget for its model calls (USD)
      description: Whole US dollars, from 5 to 1,000; on ARC-AGI-3, whose games cost far more than grids, at least 114 for a learner that names one model and 21 more for each other model it names. It pays for your learner, its reset and each model you name played bare, and the run stops if they spend it.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Billing country
      description: The two-letter code of the country you pay from, such as US or GB, which says which of our companies invoices you.
    validations:
      required: true
  - type: input
    id: billing_name
    attributes:
      label: Name on the invoice
      description: Optional. Without it, the invoice is made out to your GitHub login. This issue is public.
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: My learner calls only the models named above, and keeps as files whatever it is to carry from the stream to the tests.
          required: true
        - label: The code is public under an open licence and keeps to the README's "What a learner may use".
          required: true
        - label: The learner does not train its weights, which we cannot verify yet.
          required: true
