[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continual-arc-baselines"
version = "0.1.0"
description = "Baselines and experiment harness for the Continual-ARC benchmark"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-client-protocol==0.12.1",
    "continual-arc[plots]",
    "continual-workbench[api,tracking]",
    "google-cloud-secret-manager>=2.20",
    "httpx>=0.27",
]

# Both dependencies track main. No lockfile is committed, so a fresh `uv sync`
# resolves the latest commits and `uv sync --upgrade` refreshes an existing env.
# The commits a run actually used are recorded in its evidence (see evidence.py).
[tool.uv.sources]
continual-arc = { git = "ssh://git@github.com/unifyai/continual-arc-internal.git", branch = "main" }
continual-workbench = { git = "ssh://git@github.com/unifyai/continual-workbench.git", branch = "main" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arc-baselines = "continual_arc_baselines.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/continual_arc_baselines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
