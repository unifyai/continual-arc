[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "continual-arc-training"
version = "0.2.0"
description = "The training of Continual-ARC's trained rows, its reference rows on the open models, and their frozen tests"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "unify" }]
# The benchmark and the baselines are this repository's root and its baselines/ folder, installed beside this package
# from the same checkout. The trainer runs in the node's environment (the README's "What a node needs"), which brings
# torch, Triton, flash-linear-attention, tilelang, transformers and peft; nothing here imports them at import time.
dependencies = ["continual-arc", "continual-arc-baselines", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/unifyai/continual-arc"
Homepage = "https://unify.ai/continual-arc"

[tool.uv.sources]
continual-arc = { workspace = true }
continual-arc-baselines = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/continual_arc_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
